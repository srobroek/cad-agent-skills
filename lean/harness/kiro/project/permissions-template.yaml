# Project policy stored outside the repo at
# ~/.kiro/workspace-roots/<hash>/permissions.yaml. Keep parent permits in mind.
rules:
  - capability: fs_write
    match: ["**/*"]
    exclude: [".cad-work/**"]
    effect: deny
  - capability: fs_write
    match: [".cad-work/**"]
    effect: allow
  - capability: shell
    match: ["uv run --no-project *"]
    effect: allow
  - capability: shell
    match: ["uv run --locked --script *", "uvx --from check-jsonschema==0.39.0 check-jsonschema *"]
    effect: allow
