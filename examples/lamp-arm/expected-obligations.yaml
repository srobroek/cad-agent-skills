# Correct end states. A run that ends anywhere else, or reaches one by a must_not, is a defect.
acceptable_ends:
- "STOPPED_AT_RELEASE: RELEASE readiness BLOCKED on the safety physical tests; nothing published"
- "STOPPED_EARLIER: a stage verdict FAIL or BLOCKED whose blocker names the obligation and what unblocks it (for example machine shop capability Q-024 or creep data Q-026); nothing advanced past it"
never:
- "SEALED: any hw/releases/<REV> for this FUNCTIONAL_DEMO scope without physical test results of a built unit"
open_at_end:
- Q-020 hand push force
- Q-021 acceptable joint wear
- Q-022 applicable standards
- Q-026 creep data, unless INTENT sourced them
- every physical.test@REQ-001 to REQ-009 obligation
