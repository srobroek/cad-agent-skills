# Expected obligations for examples/lamp-arm: data for docs/demo.md and the A/B protocol, not a record file.
# No cad-record root covers it. Families, conditions, due stages and gates are those of
# full/skills/cad-flow/assets/stages.yaml; anchors follow full/skills/cad-verify/references/families.md.
# A placeholder in <> stands for every value the run allocates: <PN> every part number, <PN>.<component> every
# component, <PN>.<component>/<operation> every made operation, <case> every approved check-plan case of the named
# type, <op> every assembly operation or service task, <IF> every interface stating a fit or tolerance class.
# "(design dependent)" marks an obligation whose condition depends on the run's own frozen design.
example: lamp-arm
service_class: FUNCTIONAL_DEMO
release_ceiling: no package without physical evidence for every safety requirement (full/skills/cad-release/references/release.md "Release ceiling")

# Conditions with a fixed truth value for this brief at every stage that lists the family.
conditions:
  optical.route: {applies: false, reason: no requirement or preference needs transparency or light transmission}
  physical.test: {applies: true, reason: FUNCTIONAL_DEMO and every requirement REQ-001 to REQ-009 has a PHYSICALLY_VALIDATED facet}
  load.hand: {applies: true, reason: REQ-004 states the head load; the check plan carries a HAND load case for it}
# Conditions whose truth depends on the run's own frozen design. The run's obligations.yaml must list the family
# exactly when the condition holds on its frozen inputs, and record the reason when it does not.
design_dependent:
  delivery.integrity: "the attempt merges at least one worker delivery, a published checker or reviewer result included"
  motion.sweep: "the assembly has a joint that is not FIXED (expected: three revolute joints)"
  motion.play: "a joint, coupling or interface states play or backlash"
  motion.access: "an assembly, tool or service operation needs access (expected for REQ-007)"
  assembly.operations: "the assembly states an install, tool or service operation (expected)"
  fit.limits: "an interface or feature states a fit or tolerance class (expected for pivot pins and bushings)"
  fit.stack: "a critical interface depends on a dimension chain"
  geometry.manufacture: "a MAKE or MADE_TO_DRAWING part is built"
  capability.route: "a MAKE or MADE_TO_DRAWING part has a route"
  purchase.identity: "a part is BUY or a component is purchased (expected: LED module, pins, fasteners)"
  selection.sourcing: "a part, component or BOM row cites a supplier, stock or purchased item (expected)"
  load.fea: "the check plan has an approved FEA case; with no installed approved solver the case stays UNKNOWN UNSUPPORTED_METHOD"
  drawing.coverage: "a part or assembly drawing is REQUIRED (expected for a machined or MADE_TO_DRAWING part)"
  drawing.preview: "a part or assembly drawing is REQUIRED"
  process.fdm: "a part route of the INTENT choice includes a FDM operation"
  process.cnc: "a part route of the INTENT choice includes a CNC operation"
  process.secondary: "a part route includes a DRILLING, REAMING, TAPPING, FINISHING, COATING or HEAT_TREATMENT operation (expected for pivot bores)"
  process.joining: "a part route of the INTENT choice includes a JOINING operation"
  process.resin: "a part route of the INTENT choice includes a RESIN operation"
  process.laser: "a part route of the INTENT choice includes a LASER operation"
  process.waterjet: "a part route of the INTENT choice includes a WATERJET operation"
  process.plasma: "a part route of the INTENT choice includes a PLASMA operation"
  process.sheet_forming: "a part route of the INTENT choice includes a SHEET_FORMING operation"
  process.casting: "a part route of the INTENT choice includes a CASTING operation"
  process.moulding: "a part route of the INTENT choice includes a MOULDING operation"
  process.extrusion: "a part route of the INTENT choice includes a EXTRUSION operation"
  process.other: "a part route includes an OTHER operation"

# What the import must look like; cad-record references/import.md.
import:
  source: cad-agent v0.1.1, tag v0.1.1, commit b8f7a2ecb410e68d62a38464ffd800396cdb06c5, examples/lamp-arm/hw
  files: 32
  mapping: hw/decisions/proposals/DR-001/mapping.yaml, every source file with its sha256, presented before approval
  decision: IMPORT, binding PROPOSAL, APPROVED by the scripted answer L-01
  gate_credit: none

stages:
- stage: GROUND
  expected:
  - record.schema@product
  - record.semantic@product
  - record.ownership@product
  - record.inputs@product
  - delivery.integrity@product
  - intake.use_case@product
  future: []
  verdict: PASS
  gate: APPROVED after `approve GROUND <vN>`
  must_show:
  - the import inventory and dry-run mapping presented before any imported byte lands in hw/; the IMPORT decision from L-01
  - the original files kept byte-identical under hw/imports/DR-001/original with their sha256
  - service class FUNCTIONAL_DEMO from a QUESTION decision with a SYNTHETIC actor, separate from rigor pro
  - payload, reach, heat, duty, creep, cyclic life, electrical supply and risk asked before any material or route is named
  - the record matches examples/lamp-arm/hw in content; ids, wording and order may differ
  - the gate packet lists each consequential UNKNOWN as a limit with the stage where it blocks (cad-select references/selection.md "Scope of each unknown"); none blocks GROUND
  - Q-026 creep data block no INTENT outcome (REQ-004 head drift is PLANNED there, due ANALYSIS; ANALYSIS states creep as not established and physical.test@REQ-004 settles the drift limit at RELEASE); Q-020 hand push force at the first check whose HAND load case needs it; Q-021 acceptable wear and Q-022 standards feed no REQ-001 to REQ-009 criterion and stay open questions listed in the RELEASE readiness limits
  must_not:
  - give an imported part, model, result or decision gate credit, or assume the old CAD valid
  - run an imported model.py
  - carry over the old flow stage or a frozen version
  - ask again a question already answered, or ask for a separate approval of the service class L-12 already states
- stage: INTENT
  expected:
  - record.schema@product
  - record.semantic@product
  - record.ownership@product
  - record.inputs@product
  - selection.feasibility@product
  - selection.sourcing@product
  - material.properties@product
  future: []
  verdict: PASS, or BLOCKED on a frozen attempt whose report asks each blocking question by id (machine shop capability, PETG creep, LED module data)
  gate: APPROVED after `approve INTENT <vN> choose <option>`
  must_show:
  - polymer, metal, purchased-pivot and hybrid candidates, the old v0.1.1 layout as one candidate only
  - complete routes per part and every contacting joint pair (pin, bushing, link, retention, wear)
  - hard outcomes per criterion of each mandatory requirement before any preference ranking; a criterion only a later stage evidences PLANNED with its due stage; every UNKNOWN names its question id
  - REQ-004 head drift PLANNED due ANALYSIS on every candidate; a polymer load path EXCLUDED only when retained creep data already show it cannot hold the drift limit; missing creep data (Q-026) a limit of each polymer candidate, never a PASS and never an INTENT blocker
  - retained sources for the LED module, the printer envelope and the machine shop, or their UNKNOWNs
  must_not:
  - use supplier-typical strength as an allowable
  - rank a CONDITIONAL candidate by preference
  - infer the shop tolerance from a general tolerance label
  - rate FEASIBLE a candidate whose material, machine or provider the owner neither has nor has approved acquiring
  - ask the owner for a supplier or capability fact before a sourcing unit returned it UNKNOWN
  - stop BLOCKED without a frozen attempt and its verdict
- stage: SPECIFY
  expected:
  - record.schema@product
  - record.semantic@product
  - record.ownership@product
  - record.inputs@product
  - requirements.completeness@product
  - interfaces.completeness@product
  - check_plan.completeness@product
  future:
  - physical.test@REQ-001
  - physical.test@REQ-002
  - physical.test@REQ-003
  - physical.test@REQ-004
  - physical.test@REQ-005
  - physical.test@REQ-006
  - physical.test@REQ-007
  - physical.test@REQ-008
  - physical.test@REQ-009
  verdict: PASS
  gate: APPROVED after `approve SPECIFY <vN>`
  must_show:
  - REQ-001 to REQ-009 with PHYSICALLY_VALIDATED facets and physical.test PLANNED in the verdict future
  - REQ-004, REQ-006 and REQ-009 safety true with waiver FORBIDDEN
  - MOTION cases over every full joint range and a HAND load case at full reach
  must_not:
  - drop a physical facet to make the scope reachable
- stage: CONCEPT
  expected:
  - record.schema@product
  - record.semantic@product
  - record.ownership@product
  - record.inputs@product
  - delivery.integrity@product
  - variant.integrity@product
  - selection.feasibility@product
  - preview.render@product (when a variant has coarse geometry)
  future: []
  verdict: PASS
  gate: NOT_REQUIRED
  must_show:
  - two to four concept units in one batch, merged byte for byte
  must_not:
  - the lead repairing or ranking a variant
- stage: VARIANT
  expected:
  - record.schema@product
  - record.semantic@product
  - record.ownership@product
  - record.inputs@product
  - variant.integrity@product
  future: []
  verdict: PASS
  gate: APPROVED after `approve VARIANT <vN> choose <variant>`
  must_show:
