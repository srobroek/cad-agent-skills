  owner: user
  material_to_choice: false
  safety_relevant: false
  status: RESOLVED
  resolution: {answer: "tracked in git, kept for the life of the project", source: {kind: USER, reference: brief.md answer A-16, origin: SYNTHETIC demo owner, date: '2026-11-03'}}
- id: Q-017
