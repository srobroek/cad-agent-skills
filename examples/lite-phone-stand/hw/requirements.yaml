# Reference record for examples/lite-phone-stand: hw/requirements.yaml after GROUND stage work, before the GROUND gate.
# A lite build writes genuine APPEARANCE requirements with CAD_VALID facets only, due LAYOUT; every number is the
# owner's (A-12), and no other dimension, angle or thickness is a requirement. Questions follow the lite template.
requirements:
- id: REQ-001
  title: Overall model bounding box
  text: The model's overall bounding box measures 80 mm along X, 90 mm along Y and 100 mm along Z, each within 0.1 mm, measured on the exported STEP.
  kind: APPEARANCE
  priority: MAJOR
  subjects:
  - kind: ASSEMBLY
  criteria:
  - property: bbox_x
    comparator: BETWEEN
    value: [79.9, 80.1]
    units: mm
    source: &l12 {kind: USER, reference: brief.md answer A-12, origin: SYNTHETIC lite-demo owner, date: '2026-11-05'}
    note: 80 mm within 0.1 mm
  - property: bbox_y
    comparator: BETWEEN
    value: [89.9, 90.1]
    units: mm
    source: *l12
    note: 90 mm within 0.1 mm
  - property: bbox_z
    comparator: BETWEEN
    value: [99.9, 100.1]
    units: mm
    source: *l12
    note: 100 mm within 0.1 mm
  methods:
  - ANALYSIS
  facets:
  - CAD_VALID
  due: LAYOUT
  safety: false
  waiver_policy: FORBIDDEN
  source: *l12
  owner: SYNTHETIC lite-demo owner
- id: REQ-002
  title: One static solid
  text: The model is one part made of one solid, with no hinge, joint or moving part, standing static on its base with +Z up.
  kind: APPEARANCE
  priority: MAJOR
  subjects:
  - kind: ASSEMBLY
  criteria:
  - property: solid_count
    comparator: EQUALS
    value: 1
    units: count
    source: &l11 {kind: USER, reference: brief.md answer A-11, origin: SYNTHETIC lite-demo owner, date: '2026-11-05'}
  methods:
  - ANALYSIS
  facets:
  - CAD_VALID
  due: LAYOUT
  safety: false
  waiver_policy: FORBIDDEN
  source: *l11
  owner: SYNTHETIC lite-demo owner
- id: REQ-003
  title: Sloped back and front retaining lip
  text: The model shows a sloped back and a front retaining lip as features of its final shape; their angle, height and thickness are design choices, not requirements.
  kind: APPEARANCE
  priority: MAJOR
  subjects:
  - kind: ASSEMBLY
  criteria:
  - property: sloped_back
    comparator: EQUALS
    value: true
    source: *l11
  - property: front_lip
    comparator: EQUALS
    value: true
    source: *l11
  methods:
  - INSPECTION
  facets:
  - CAD_VALID
  due: LAYOUT
  safety: false
  waiver_policy: FORBIDDEN
  source: *l11
  owner: SYNTHETIC lite-demo owner
preferences: []
assumptions: []
