cases:
- id: hinge-travel
  kind: MOTION
  subjects:
  - kind: ASSEMBLY
  state: assembled, nominal
  joints:
  - hinge
  sampling:
    kind: GRID
    count: 34
  steps:
  - joint: hinge
    step:
      value: 2
      units: deg
  pairs: ALL
  play_extremes: true
  criterion: *id001
- id: hinge-stack
  kind: STACK
  subjects:
  - kind: INTERFACE
    interface: IF-001
  state: assembled
  interface: IF-001
  method: JUSTIFIED_RSS
  contributors:
  - id: bore
    subject:
      kind: FEATURE
      PN: STD-0001
      feature: hinge_bore
    sign: 1
    nominal:
      value: 5.0
      units: mm
    tolerance:
      lower: 0
      upper: 0.075
      units: mm
    state: AFTER_FINISH
    source: *id002
  - id: pin
    subject:
      kind: FEATURE
      PN: STD-0003
      feature: pin_shank
    sign: -1
    nominal:
      value: 5.0
      units: mm
    tolerance:
      lower: 0.004
      upper: 0.012
      units: mm
    state: AS_MANUFACTURED
    source: *id002
  criterion: *id001
- id: mass-worst
  kind: MASS
  subjects:
  - kind: PRODUCT
  densities:
  - subject:
      kind: PART
      PN: STD-0001
    density:
      status: KNOWN
      value:
        value: 1.25
        units: g_cm3
      basis: SUPPLIER_TYPICAL
      sources:
      - kind: DATASHEET
        reference: Supplier datasheet
        revision: V5.4
        url: https://example.com/ds.pdf
        accessed: '2026-11-02'
        conditions: ISO 527, 23 °C
  outputs:
  - MASS
  - CENTRE_OF_MASS
