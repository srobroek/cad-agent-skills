common/invalid/estimate-without-uncertainty.yaml: "$.fact[0]: 'uncertainty' is a required property"
# a quantity is a value or an interval, not both
common/invalid/interval-and-value.yaml: "should not be valid under {'anyOf': [{'required': ['lower']}, {'required': ['upper']}]}"
# NOT_APPLICABLE needs reviewed_by
common/invalid/na-unreviewed.yaml: "$.fact[0]: 'reviewed_by' is a required property"
