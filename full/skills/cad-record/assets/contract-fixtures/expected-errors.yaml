version-manifest/invalid/duplicate-kernel.json: '$.runtime.environments: Too many items match the given schema (expected at most 1)'
# geometry is millimetres, right-handed Z-up
version-manifest/invalid/geometry-not-mm.json: "$.geometry.units: 'mm' was expected"
# inventories hold only hw/versions/vN snapshots; no downstream results
version-manifest/invalid/includes-check-result.json: "$.record[3].path: 'hw/checks/v6/clearance/a1/result.json' does not match"
# the manifest and stage verdict are never inventoried
version-manifest/invalid/includes-itself.json: '$.record[3].path: ''hw/versions/v6/record/manifest.json'' should not be valid under {''pattern'': ''(^|/)(manifest|stage-verdict)\\.json$''}'
# NOT_APPLICABLE geometry states its reason
version-manifest/invalid/pre-cad-no-reason.json: "$.geometry: 'reason' is a required property"
# runtime records environments[], never a top-level kernel, python or packages
version-manifest/invalid/runtime-single-kernel.json: "$.runtime: Additional properties are not allowed ('kernel', 'packages', 'python' were unexpected)"
# a checker or reviewer brief lists the obligation IDs it covers, so a lost unit's obligations can be recorded UNKNOWN
worker-brief/invalid/checker-without-obligations.yaml: "$.expected: 'obligations' is a required property"
# installed skills are never hashed: installed_sha256 is not a field
worker-brief/invalid/installed-hash.yaml: "$.resources: Additional properties are not allowed ('installed_sha256' was unexpected)"
# a uv script lock is writable only as the unit's own scratch .cad-work/<unit>/build.py.lock or check.py.lock, never under hw/
worker-brief/invalid/lock-outside-scratch.yaml: '$.boundary.writable[1]: ''hw/parts/STD-0001/build.py.lock'' does not match ''^\\.cad-work/'
# every brief carries its unit limits (wall seconds and model turns) for the stall rule
worker-brief/invalid/missing-limits.yaml: "$: 'limits' is a required property"
# resources name the installed plugin name and version
worker-brief/invalid/missing-plugin.yaml: "$.resources: 'plugin' is a required property"
# resources name the cad-review rubric reference every role grades with
worker-brief/invalid/missing-rubric.yaml: "$.resources: 'rubric' is a required property"
# resources list the delivery template and valid check-result fixtures the worker starts from
worker-brief/invalid/missing-templates.yaml: "$.resources: 'templates' is a required property"
# every role but the reviewer carries the preflight-resolved check-jsonschema argv
worker-brief/invalid/missing-validator.yaml: "does not contain items matching the given schema"
# a content-addressed target pattern belongs to a sourcing brief only
worker-brief/invalid/pattern-outside-sourcing.yaml: "$.expected.outputs[2]: 'target' is a required property"
# a target pattern is bounded to one sha256-named directory and file name
worker-brief/invalid/pattern-unbounded.yaml: "$.expected.outputs[0].target_pattern: 'hw/manufacturing/sources/**' does not match"
# plugin provenance is name and version from the cad-flow SKILL.md metadata; no manifest path
worker-brief/invalid/plugin-manifest-field.yaml: "$.resources.plugin: Additional properties are not allowed ('manifest' was unexpected)"
# plugin version is a semver string
worker-brief/invalid/plugin-version-not-semver.yaml: "$.resources.plugin.version: 'latest' does not match"
# resource paths are literal absolute paths from preflight
worker-brief/invalid/relative-skill-path.yaml: "$.resources.skills[0].path: 'skills/cad-model/SKILL.md' does not match '^/"
# unit ids exclude lead and stage-*
worker-brief/invalid/reserved-unit.yaml: "$.unit: 'lead' does not match '^(?!lead$)"
# input inventory files are hw/ paths (set digest)
worker-brief/invalid/scratch-input.yaml: "$.input_inventory.files[0].path: '.cad-work/base-part/input/part.yaml' does not match '^hw/"
# resource entries carry name, absolute path and URI, never a sha256
worker-brief/invalid/skill-hash.yaml: "$.resources.skills[0]: Additional properties are not allowed ('sha256' was unexpected)"
# an installed asset reaches the unit as a snapshot named by its skill-relative logical path, never an absolute path
worker-brief/invalid/snapshot-absolute-installed.yaml: "$.input_inventory.snapshots[1].path: '/Users/me/.agents/skills/cad-record/assets/project-template/hw/product.yaml' does not match"
# a snapshot path is lead/attempts.txt or installed/<skill-name>/<path>, with no dot segment
worker-brief/invalid/snapshot-outside-lead.yaml: "$.input_inventory.snapshots[0].path: 'lead/../hw/product.yaml' does not match"
# a sourcing brief carries its seed URLs (empty only with a host search tool)
worker-brief/invalid/sourcing-without-seed-urls.yaml: "$: 'seed_urls' is a required property"
# templates are the installed delivery template or a valid check-result fixture, never an invalid one
worker-brief/invalid/template-invalid-fixture.yaml: "check-result/invalid/unknown-reported-pass.json' does not match '(/cad-flow/assets/worker-delivery"
# a tool argv starts with the absolute path preflight installed, never a uvx resolution
worker-brief/invalid/tool-argv-uvx.yaml: "$.resources.tools[0].argv[0]: 'uvx' does not match '^/"
# roles are the five native roles
worker-brief/invalid/unknown-role.yaml: "$.role: 'cad-analyst' is not one of ['cad-concept-designer', 'cad-part-designer', 'cad-checker', 'cad-mech-dfm-reviewer', 'cad-sourcing-researcher']"
# a worker writes only under .cad-work/
worker-brief/invalid/writable-hw.yaml: '$.boundary.writable[0]: ''hw/parts/STD-0001'' does not match ''^\\.cad-work/'
# a boundary violation makes the delivery MAJOR
worker-delivery/invalid/boundary-violation-pass.json: "$.verdict: 'MAJOR' was expected"
# a failed build is never a ready PASS
worker-delivery/invalid/failed-build-ready-pass.json: "$.verdict: 'MAJOR' was expected"
# only PASS is ready
worker-delivery/invalid/minor-ready.json: "$.verdict: 'PASS' was expected"
# a FAIL or UNKNOWN check is never a ready PASS
worker-delivery/invalid/unknown-check-pass.json: "$.verdict: 'PASS' should not be valid under {'const': 'PASS'}"
