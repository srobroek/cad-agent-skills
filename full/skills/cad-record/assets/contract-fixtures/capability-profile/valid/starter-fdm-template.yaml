title: FDM printer (template)
process: FDM
provider: LOCAL
template: true
guidance:
- Copy this profile into hw/manufacturing/capabilities.yaml, give it your own id, then remove template and guidance.
- Record your actual machine, operator or supplier values with their sources; leave a value unknown, with its reason, until
  you have one.
- 'Parameters describe the machine and are never its achieved accuracy: record achievable dimensions, features and finish
  only as calibrations from your own coupons, measurements or supplier evidence, each scoped to its material, feature, orientation,
  setup and tool.'
- Record nozzle, filament, layer height, hotend, bed and enclosure limits, filament drying and support materials.
- Calibrate walls, small features, holes, bridges, overhangs, warping and layer strength per filament profile, orientation
  and settings; a slicer preview or a print trial is evidence only for what it shows.
