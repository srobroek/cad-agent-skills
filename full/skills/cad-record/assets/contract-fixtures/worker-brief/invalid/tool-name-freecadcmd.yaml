format: cad-agent-skills.worker-brief
schema_version: 1
unit: layout-v2-geometry
role: cad-checker
stage: LAYOUT
version: v2
task: Run the lite geometry, FreeCAD readback and render checks on LAYOUT v2 and deliver one VERSION-bound result per check
subjects:
- kind: ASSEMBLY
- kind: PART
  PN: STD-0001
input_inventory:
  sha256: '2222222222222222222222222222222222222222222222222222222222222222'
  files:
  - path: hw/versions/v2/manifest.json
    sha256: '6666666666666666666666666666666666666666666666666666666666666666'
  - path: hw/versions/v2/record/check-plan.yaml
    sha256: '7777777777777777777777777777777777777777777777777777777777777777'
  - path: hw/versions/v2/record/parts/STD-0001/model.py
    sha256: '8888888888888888888888888888888888888888888888888888888888888888'
  - path: hw/versions/v2/definition/STD-0001.step
    sha256: '9999999999999999999999999999999999999999999999999999999999999999'
  - path: hw/versions/v2/definition/assembly.step
    sha256: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
  snapshots: []
resources:
  plugin:
    name: cad-agent-skills
    version: 0.1.0
  skills:
  - name: cad-verify
    path: /Users/me/.agents/skills/cad-verify/SKILL.md
    uri: skill://cad-verify
  - name: cad-model
    path: /Users/me/.agents/skills/cad-model/SKILL.md
    uri: skill://cad-model
  - name: cad-record
    path: /Users/me/.agents/skills/cad-record/SKILL.md
    uri: skill://cad-record
  rubric:
    name: rubric
    path: /Users/me/.agents/skills/cad-review/references/rubric.md
    uri: skill://cad-review/references/rubric.md
  schemas:
  - name: check-result
    path: /Users/me/.agents/skills/cad-record/schemas/check-result.schema.json
  - name: worker-delivery
    path: /Users/me/.agents/skills/cad-record/schemas/worker-delivery.schema.json
  tools:
  - name: check-jsonschema
    argv:
    - /Users/me/projects/lite-phone-stand/.cad-work/lead/validator/bin/check-jsonschema
    version: check-jsonschema, version 0.39.0
  - name: yaml-loader
    argv:
    - /Users/me/projects/lite-phone-stand/.cad-work/lead/validator/bin/python
    version: PyYAML 6.0.3
  - name: freecadcmd
    argv:
    - /Applications/FreeCAD.app/Contents/Resources/bin/freecadcmd
    version: FreeCAD 1.1.4
  templates:
  - name: worker-delivery
    path: /Users/me/.agents/skills/cad-flow/assets/worker-delivery.yaml
  - name: check-result-version
    path: /Users/me/.agents/skills/cad-record/assets/contract-fixtures/check-result/valid/version-pass.json
  role_reference:
    name: agent-roles
    path: /Users/me/.agents/skills/cad-flow/references/agent-roles.md
    uri: skill://cad-flow/references/agent-roles.md
boundary:
  project_root: /Users/me/projects/lite-phone-stand
  scratch: .cad-work/layout-v2-geometry
  writable:
  - .cad-work/layout-v2-geometry/output
  - .cad-work/layout-v2-geometry/check.py
  - .cad-work/layout-v2-geometry/check.py.lock
  - .cad-work/layout-v2-geometry/build.py
  - .cad-work/layout-v2-geometry/build.py.lock
  - .cad-work/layout-v2-geometry/tmp
  - .cad-work/layout-v2-geometry/__pycache__
  - .cad-work/layout-v2-geometry/delivery.json
  - .cad-work/lead/.uv-cache
  locked: []
expected:
  outputs:
  - target: hw/checks/v2/geometry-build/a1/result.json
    kind: check result
  - target: hw/checks/v2/geometry-build/a1/artifacts/build-signature.json
    kind: check artifact
  - target: hw/checks/v2/geometry-build/a1/artifacts/build-stdout.txt
    kind: check artifact
  - target: hw/checks/v2/geometry-build/a1/artifacts/build-stderr.txt
    kind: check artifact
  - target: hw/checks/v2/geometry-readback/a1/result.json
    kind: check result
  - target: hw/checks/v2/geometry-readback/a1/artifacts/freecad-readback.json
    kind: check artifact
  - target: hw/checks/v2/geometry-readback/a1/artifacts/freecad-run.json
    kind: check artifact
  - target: hw/checks/v2/geometry-readback/a1/artifacts/freecad-stdout.txt
    kind: check artifact
  - target: hw/checks/v2/geometry-readback/a1/artifacts/freecad-stderr.txt
    kind: check artifact
  - target: hw/checks/v2/geometry-readback/a1/artifacts/criteria.json
    kind: check artifact
  - target: hw/checks/v2/geometry-export/a1/result.json
    kind: check result
  - target: hw/checks/v2/geometry-identity/a1/result.json
    kind: check result
  - target: hw/checks/v2/geometry-identity/a1/artifacts/criteria.json
    kind: check artifact
  - target: hw/checks/v2/preview-render/a1/result.json
    kind: check result
  - target_pattern: hw/checks/v2/preview-render/a1/artifacts/<name>
    kind: check artifact
    max: 4
  checks:
  - geometry-build
  - geometry-readback
  - geometry-export
  - geometry-identity
  - preview-render
  obligations:
  - geometry.build@assembly
  - geometry.build@STD-0001
  - geometry.readback@assembly
  - geometry.readback@STD-0001
  - geometry.export@STD-0001
  - geometry.export@assembly
  - geometry.identity@STD-0001.body
  - preview.render@assembly
  - preview.render@STD-0001
  stop:
  - a needed input copy is missing or fails its SHA256SUMS line
  report: VERDICT line, delivery.json path, findings, unknowns
lead:
  session: claude-2026-11-05-a
limits:
  wall_seconds: 2400
  model_turns: 150
