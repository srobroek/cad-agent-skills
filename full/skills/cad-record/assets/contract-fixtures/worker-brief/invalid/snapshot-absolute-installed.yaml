format: cad-agent-skills.worker-brief
schema_version: 1
unit: ground-v1-checker
role: cad-checker
stage: GROUND
version: v1
task: Run record-semantic and intake-use-case on GROUND v1 and deliver one VERSION-bound result per check
subjects:
- kind: PRODUCT
input_inventory:
  sha256: '2222222222222222222222222222222222222222222222222222222222222222'
  files:
  - path: hw/product.yaml
    sha256: '6666666666666666666666666666666666666666666666666666666666666666'
  - path: hw/decisions/DR-001.yaml
    sha256: '7777777777777777777777777777777777777777777777777777777777777777'
  snapshots:
  - path: lead/attempts.txt
    sha256: '8888888888888888888888888888888888888888888888888888888888888888'
  - path: /Users/me/.agents/skills/cad-record/assets/project-template/hw/product.yaml
    sha256: '9999999999999999999999999999999999999999999999999999999999999999'
resources:
  plugin:
    name: cad-agent-skills
    version: 0.1.0
  skills:
  - name: cad-verify
    path: /Users/me/.agents/skills/cad-verify/SKILL.md
    uri: skill://cad-verify
  - name: cad-record
    path: /Users/me/.agents/skills/cad-record/SKILL.md
    uri: skill://cad-record
  rubric:
    name: rubric
    path: /Users/me/.agents/skills/cad-review/references/rubric.md
    uri: skill://cad-review/references/rubric.md
  schemas:
  - name: check-result
    path: /Users/me/.agents/skills/cad-record/schemas/check-result.schema.json
  - name: worker-delivery
    path: /Users/me/.agents/skills/cad-record/schemas/worker-delivery.schema.json
  tools:
  - name: check-jsonschema
    argv:
    - /Users/me/projects/phone-stand/.cad-work/lead/validator/bin/check-jsonschema
    version: check-jsonschema, version 0.39.0
  - name: yaml-loader
    argv:
    - /Users/me/projects/phone-stand/.cad-work/lead/validator/bin/python
    version: PyYAML 6.0.3
  templates:
  - name: worker-delivery
    path: /Users/me/.agents/skills/cad-flow/assets/worker-delivery.yaml
  - name: check-result-version
    path: /Users/me/.agents/skills/cad-record/assets/contract-fixtures/check-result/valid/version-pass.json
  - name: check-result-semantic
    path: /Users/me/.agents/skills/cad-record/assets/contract-fixtures/check-result/valid/semantic-aggregate-fail.json
  role_reference:
    name: agent-roles
    path: /Users/me/.agents/skills/cad-flow/references/agent-roles.md
    uri: skill://cad-flow/references/agent-roles.md
  layout: /Users/me/.agents/skills/cad-record/layout.json
  policy: /Users/me/.agents/skills/cad-flow/assets/stages.yaml
boundary:
  project_root: /Users/me/projects/phone-stand
  scratch: .cad-work/ground-v1-checker
  writable:
  - .cad-work/ground-v1-checker
  - .cad-work/lead/.uv-cache
  locked:
  - hw/product.yaml
  - hw/requirements.yaml
expected:
  outputs:
  - target: hw/checks/v1/record-semantic/a1/result.json
    kind: check result
  - target: hw/checks/v1/record-semantic/a1/artifacts/items.json
    kind: check artifact
  - target: hw/checks/v1/intake-use-case/a1/result.json
    kind: check result
  checks:
  - record-semantic
  - intake-use-case
  obligations:
  - record.semantic@product
  - intake.use_case@product
  stop:
  - a FAIL or UNKNOWN record.semantic makes intake.use_case UNKNOWN NOT_RUN
  report: VERDICT line, delivery.json path, findings, unknowns
lead:
  session: omp-2026-11-03-a
limits:
  wall_seconds: 2400
  model_turns: 150
